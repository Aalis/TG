<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Telegram Group Parser - A modern web application for parsing Telegram groups"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Telegram Group Parser</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <style>
      /* Basic styles that apply before React loads */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }
      
      /* Light theme is default */
      html {
        background-color: #f5f5f5;
        color: #000000;
      }
      
      /* Dark theme is applied via a data-theme attribute */
      html[data-theme='dark'] {
        background-color: #121212;
        color: #ffffff;
      }
      
      /* Loading indicator for when JS is taking time to load */
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f5f5f5;
        transition: opacity 0.5s ease-in-out;
      }
      
      html[data-theme='dark'] .app-loading {
        background-color: #121212;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(0, 0, 0, 0.1);
        border-radius: 50%;
        border-top-color: #2196f3;
        animation: spin 1s ease-in-out infinite;
      }
      
      html[data-theme='dark'] .loading-spinner {
        border-color: rgba(255, 255, 255, 0.1);
        border-top-color: #2196f3;
      }
      
      .loading-text {
        margin-top: 20px;
        font-family: 'Roboto', sans-serif;
        font-size: 16px;
        color: #000000;
      }
      
      html[data-theme='dark'] .loading-text {
        color: #ffffff;
      }
      
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      
      .app-loaded .app-loading {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script>
      // Get theme from localStorage to apply immediately
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', initialTheme);
          
          // Add class when app is loaded to fade out loading spinner
          window.addEventListener('load', function() {
            setTimeout(function() {
              document.body.classList.add('app-loaded');
            }, 500);
          });
        } catch(e) {
          console.error('Error applying theme:', e);
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- Loading indicator that shows while JavaScript loads -->
    <div class="app-loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Telegram Parser...</div>
    </div>
  </body>
</html>
